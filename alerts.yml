name: Pinehurst Alerts

# Runs on a schedule. No app, no server — GitHub runs this for you.
# All times are UTC. US market regular hours are 13:30–20:00 UTC
# (8:30 AM–3:00 PM Chicago / 9:30 AM–4:00 PM New York), standard time.
# We offset off the top of the hour (:02 etc.) because GitHub delays
# runs scheduled exactly on the hour.

on:
  schedule:
    # Every 15 min, 13:00–21:00 UTC, Mon–Fri. The :02/:17/:32/:47 offsets
    # dodge the top-of-hour congestion that delays GitHub scheduled jobs.
    - cron: "2,17,32,47 13-20 * * 1-5"
  workflow_dispatch:        # lets you run it manually from the Actions tab

# Allow the job to commit state.json back to the repo.
permissions:
  contents: write

# If a run is still going when the next fires, cancel the old one.
concurrency:
  group: pinehurst-alerts
  cancel-in-progress: true

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TICKERS: ${{ vars.TICKERS }}
        run: python run_alerts.py

      - name: Commit updated state
        run: |
          git config user.name "pinehurst-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
