name: Keep Alive

# GitHub auto-disables scheduled workflows after 60 days of repo inactivity.
# This weekly job makes a tiny commit so that never happens. Set and forget.

on:
  schedule:
    - cron: "13 6 * * 1"     # Mondays 06:13 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file
        run: |
          date -u > .keepalive
          git config user.name "pinehurst-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "keep alive [skip ci]" || exit 0
          git push
